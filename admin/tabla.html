<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel de administración para gestión de reseñas">
    <meta name="author" content="Ecoenergy">
    <title>Panel de Administración - Reseñas Ecoenergy</title>
    <link rel="stylesheet" href="css/tabla.css">
</head>
<body>
    <!-- =============================================
    HEADER/NAVBAR DEL PANEL DE ADMINISTRACIÓN
    ============================================= -->
    <header class="admin-header">
        <div class="header-container">
            <div class="admin-logo">
                <div class="logo">ECO</div>
                <div class="admin-title">
                    <h1>Panel de Administración</h1>
                    <p>Gestión de reseñas de usuarios</p>
                </div>
            </div>
            <div class="admin-actions">
                <div class="admin-user">Admin:XD</div>
                <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
            </div>
        </div>
    </header>

    <!-- =============================================
        CONTENEDOR PRINCIPAL DEL PANEL
    ============================================= -->
    <div class="admin-container">
        <!-- Header del panel con estadísticas -->
        <div class="panel-header">
            <h2>Reseñas de Usuarios</h2>
            <p>Gestiona todas las reseñas recibidas y controla su visibilidad en el sitio web</p>
            <div class="panel-stats">
                <div class="stat-card">
                    <div class="stat-number">8</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">5</div>
                    <div class="stat-label">Visibles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">3</div>
                    <div class="stat-label">Ocultas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">2</div>
                    <div class="stat-label">Hoy</div>
                </div>
            </div>
        </div>

        <!-- Controles de filtros y búsqueda -->
        <div class="table-controls">
            <div class="filter-group">
                <label for="statusFilter">Filtrar por visibilidad:</label>
                <select id="statusFilter" class="filter-select">
                    <option value="all">Todas</option>
                    <option value="visible">Visibles</option>
                    <option value="hidden">Ocultas</option>
                </select>
            </div>
            <div class="filter-group">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nombre...">
                <button class="btn-refresh">Actualizar</button>
            </div>
        </div>

        <!-- Tabla principal de reseñas -->
        <div class="table-container">
            <table class="requests-table">
                <thead>
                    <tr>
                        <th class="col-id">ID</th>
                        <th class="col-name">Nombre</th>
                        <th class="col-review">Reseña</th>
                        <th class="col-date">Fecha</th>
                        <th class="col-visibility">Visible</th>
                        <th class="col-actions">Acciones</th>
                    </tr>
                </thead>
                <tbody id="resenas_tabla">
                    <!-- Reseña de ejemplo 1 -->
                    
                </tbody>
            </table>
        </div>

        <!-- Información de paginación -->
        <div class="pagination-container">
            <div class="pagination-info">
                Mostrando 8 de 8 reseñas totales
            </div>
        </div>
    </div>

    <script src="js/tabla_admin.js"></script>
    <script src="js/resenas_admin.js"></script> 
</body>
</html>
